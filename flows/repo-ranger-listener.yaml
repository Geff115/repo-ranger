id: repo-ranger-listener
namespace: dev
description: "Listens for GitHub Issues and triggers the AI Agent pipeline with duplicate detection using Kestra's built-in AI Agent."

tasks:
  - id: check_action
    type: io.kestra.plugin.core.flow.If
    condition: "{{ trigger.body.action == 'opened' or trigger.body.action == 'edited' }}"
    then:
      - id: log_issue_details
        type: io.kestra.plugin.core.log.Log
        message: |
          🚨 **New GitHub Issue Event Detected!** 🚨
          > Action: {{ trigger.body.action }}
          > Repo: {{ trigger.body.repository.full_name }}
          > Issue Title: {{ trigger.body.issue.title }}
          > Sender: {{ trigger.body.sender.login }}
          > Issue URL: {{ trigger.body.issue.html_url }}
          
          Starting Agent analysis...
      
      - id: fetch_recent_issues
        type: io.kestra.plugin.scripts.python.Script
        beforeCommands:
          - pip install requests
        docker:
          image: python:3.11-slim
          networkMode: host
        outputFiles:
          - "*.json"
        script: |
          import json
          import requests
          from datetime import datetime, timedelta
          
          current_issue_number = {{ trigger.body.issue.number }}
          
          headers = {
              "Authorization": "Bearer {{ kv('GITHUB_PAT') }}",
              "Accept": "application/vnd.github+json"
          }
          
          since_date = (datetime.now() - timedelta(days=90)).isoformat()
          
          print(f"Fetching recent issues since {since_date}...")
          
          response = requests.get(
              "https://api.github.com/repos/Geff115/repo-ranger/issues",
              headers=headers,
              params={"state": "all", "since": since_date, "per_page": 100}
          )
          
          issues = response.json() if response.status_code == 200 else []
          
          recent_issues = []
          for issue in issues:
              if issue["number"] != current_issue_number:
                  labels = [l["name"] for l in issue.get("labels", [])]
                  if "report" not in labels and "ai-generated" not in labels:
                      recent_issues.append({
                          "number": issue["number"],
                          "title": issue["title"],
                          "body": issue.get("body", "")[:300],
                          "state": issue["state"]
                      })
          
          with open('recent_issues.json', 'w') as f:
              json.dump(recent_issues, f, indent=2)
          
          print(f"Fetched {len(recent_issues)} recent issues for duplicate detection")

      - id: ai_agent_classification
        type: io.kestra.plugin.ai.agent.AIAgent
        provider:
          type: io.kestra.plugin.ai.provider.OpenAI
          apiKey: "{{ kv('GROQ_API_KEY') }}"
          modelName: openai/gpt-oss-120b
          baseUrl: https://api.groq.com/openai/v1
        configuration:
          temperature: 0.3
          maxToken: 2000
          responseFormat:
            type: JSON
            jsonSchema:
              type: object
              required: ["category", "priority", "summary", "affected_files", "duplicate_detection", "suggested_next_steps"]
              properties:
                category:
                  type: string
                  enum: ["bug", "feature", "documentation", "question"]
                priority:
                  type: string
                  enum: ["high", "medium", "low"]
                summary:
                  type: string
                affected_files:
                  type: array
                  items:
                    type: string
                duplicate_detection:
                  type: object
                  properties:
                    is_duplicate:
                      type: boolean
                    similar_issues:
                      type: array
                      items:
                        type: object
                        properties:
                          number:
                            type: integer
                          title:
                            type: string
                          similarity:
                            type: string
                            enum: ["high", "medium", "low"]
                          reason:
                            type: string
                    recommendation:
                      type: string
                suggested_next_steps:
                  type: array
                  items:
                    type: string
        systemMessage: |
          You are RepoRanger AI, an expert at analyzing GitHub issues.
          You provide detailed classification and can identify duplicate or similar issues.
          You must respond with valid JSON matching the provided schema.
        prompt: |
          Analyze this GitHub issue and provide classification. Check if it's similar to any recent issues.

          CURRENT ISSUE:
          Title: {{ trigger.body.issue.title }}
          Body: {{ trigger.body.issue.body }}

          RECENT ISSUES (for duplicate detection):
          {{ read(outputs.fetch_recent_issues.outputFiles['recent_issues.json']) }}

          Respond with ONLY this JSON structure (no markdown, no code fences):
          {
            "category": "bug|feature|documentation|question",
            "priority": "high|medium|low",
            "summary": "brief summary",
            "affected_files": ["file1.py", "file2.js"],
            "duplicate_detection": {
                "is_duplicate": true/false,
                "similar_issues": [
                {
                    "number": 123,
                    "title": "Similar issue title",
                    "similarity": "high|medium|low",
                    "reason": "why they are similar"
                }
                ],
                "recommendation": "what to do"
            },
            "suggested_next_steps": ["step 1", "step 2"]
          }

      - id: post_comment_and_labels
        type: io.kestra.plugin.scripts.python.Script
        beforeCommands:
          - pip install requests
        docker:
          image: python:3.11-slim
          networkMode: host
        script: |
          import json
          import requests
          import re
          
          # Get classification from Kestra AI Agent
          ai_output = r'''{{ outputs.ai_agent_classification.jsonOutput }}'''

          # Strip markdown code fences if present
          ai_output = ai_output.strip()
          ai_output = re.sub(r'^```(?:json)?\s*', '', ai_output)
          ai_output = re.sub(r'\s*```$', '', ai_output)
          ai_output = ai_output.strip()

          classification = json.loads(ai_output)

          print(f"Classification: {classification.get('category')} / {classification.get('priority')}")
          print(f"Raw classification: {json.dumps(classification, indent=2)}")
          
          headers = {
              "Authorization": "Bearer {{ kv('GITHUB_PAT') }}",
              "Accept": "application/vnd.github+json"
          }
          
          # Build comment
          affected_files = '\n'.join(f"- `{f}`" for f in classification.get('affected_files', []))
          next_steps = '\n'.join(f"{i+1}. {step}" for i, step in enumerate(classification.get('suggested_next_steps', [])))
          
          # Duplicate detection section
          duplicate_info = classification.get('duplicate_detection', {})
          duplicate_section = ""
          
          # Handle case where duplicate_detection has different structure
          if duplicate_info:
            # Check if it's the simple format: {"duplicate_of": 44}
            if 'duplicate_of' in duplicate_info:
                duplicate_section = f"\n\n## 🔍 Duplicate Detection\n\n"
                duplicate_section += f"⚠️ **This appears to be a duplicate of existing issue:**\n\n"
                duplicate_section += f"🔴 **#{duplicate_info['duplicate_of']}**: [View Issue](https://github.com/Geff115/repo-ranger/issues/{duplicate_info['duplicate_of']})\n\n"
                duplicate_section += "**💡 Recommendation:** Review the existing issue before proceeding.\n"
            # Check if it's the full format with similar_issues array
            elif duplicate_info.get('is_duplicate') or duplicate_info.get('similar_issues'):
                similar_issues = duplicate_info.get('similar_issues', [])
                if similar_issues:
                    duplicate_section = "\n\n## 🔍 Duplicate Detection\n\n"
                    if duplicate_info.get('is_duplicate'):
                        duplicate_section += "⚠️ **This appears to be a duplicate or very similar to existing issues:**\n\n"
                    else:
                        duplicate_section += "ℹ️ **Found similar issues that might be related:**\n\n"
                    
                    for issue in similar_issues:
                        similarity_emoji = "🔴" if issue.get('similarity') == 'high' else "🟡" if issue.get('similarity') == 'medium' else "🟢"
                        duplicate_section += f"{similarity_emoji} **#{issue.get('number')}**: [{issue.get('title', 'Unknown')}](https://github.com/Geff115/repo-ranger/issues/{issue.get('number')})\n"
                        duplicate_section += f"   - Similarity: {issue.get('similarity', 'unknown')}\n"
                        duplicate_section += f"   - Reason: {issue.get('reason', 'N/A')}\n\n"
                    
                    if duplicate_info.get('recommendation'):
                        duplicate_section += f"**💡 Recommendation:** {duplicate_info['recommendation']}\n"
          
          comment_body = f"""🤖 **RepoRanger Analysis Complete!**

          **Category:** {classification.get('category', 'unknown')}
          **Priority:** {classification.get('priority', 'unknown')}
          **Summary:** {classification.get('summary', 'N/A')}

          **Potentially Affected Files:**
          {affected_files if affected_files else 'No files identified'}

          **Suggested Next Steps:**
          {next_steps if next_steps else 'No specific steps suggested'}
          {duplicate_section}

          ---
          *Powered by RepoRanger • [View Dashboard](https://repo-ranger-8k3c.vercel.app/)*
          """
          
          # Post comment
          comment_response = requests.post(
              "{{ trigger.body.issue.comments_url }}",
              headers=headers,
              json={"body": comment_body}
          )
          
          print(f"Comment posted! Status: {comment_response.status_code}")
          
          # Add labels
          labels = []
          
          category_map = {
              "bug": "bug",
              "feature": "enhancement",
              "documentation": "documentation",
              "question": "question"
          }
          if classification.get('category') in category_map:
              labels.append(category_map[classification['category']])
          
          priority_map = {
              "high": "priority: high",
              "medium": "priority: medium",
              "low": "priority: low"
          }
          if classification.get('priority') in priority_map:
              labels.append(priority_map[classification['priority']])
          
          if duplicate_info.get('is_duplicate'):
              labels.append("duplicate")
          
          next_steps_text = ' '.join(classification.get('suggested_next_steps', [])).lower()
          if 'duplicate' in next_steps_text or 'identical' in next_steps_text:
            if 'duplicate' not in labels:
                labels.append("duplicate")
                print("🔍 Detected duplicate mention in suggested steps, adding label")
          
          if labels:
              label_response = requests.post(
                  "{{ trigger.body.issue.url }}/labels",
                  headers=headers,
                  json={"labels": labels}
              )
              print(f"Labels added! Status: {label_response.status_code}")
          
          print("✅ All operations completed successfully!")

    else:
      - id: skip_action
        type: io.kestra.plugin.core.log.Log
        message: "Skipping action: {{ trigger.body.action }} (only processing 'opened' or 'edited')"

triggers:
  - id: github_issue_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "hackathon-secret-key"